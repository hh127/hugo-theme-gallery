<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相册管理台</title>
    <link rel="stylesheet" href="/app.css" />
    <script>
      // 首帧前定好主题，避免白/黑闪一下（默认亮色）
      try {
        var t = localStorage.getItem('admin-theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◉</span>
        <div>
          <div class="brand-title" id="brandTitle">相册管理台</div>
          <div class="brand-sub" id="brandSub">正在连接…</div>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="overview" class="active">概览</button>
        <button data-tab="albums">相册</button>
        <button data-tab="stories">游记</button>
        <button data-tab="pages">页面</button>
        <button data-tab="build">构建</button>
        <button data-tab="publish">发布</button>
      </nav>
      <div class="topbar-right">
        <span class="env" id="env"></span>
        <button class="ghost" id="btnTheme" title="切换亮色 / 暗色主题">☀ 亮色</button>
        <button class="ghost" id="btnReload" title="重新读取仓库状态">↻ 刷新</button>
      </div>
    </header>

    <main id="view"></main>

    <dialog id="modal">
      <form method="dialog" id="modalForm">
        <h3 id="modalTitle">编辑</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
          <button value="cancel" class="ghost" formnovalidate>取消</button>
          <button value="ok" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <div id="toasts"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
